<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimientos</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logoapp.png" type="image/png">
</head>
<body>
    <header class="header">
        <div class="logo-header">
            <img src="../img/logoapp.png" alt="Logo de la aplicación" class="logo-app-header">
            <span class="logo-texto-header">Balance</span>
        </div>
        <a href="configuracion.html" class="micuenta-header" aria-label="Ir a Mi cuenta">
            <img src="../img/iconoperfil.png" alt="Foto de perfil" class="foto-perfil-header">
        </a>
    </header>
    <hr class="separador-header">
<main>
    <div class="encabezado-agregar">
        <h1 class="titulo-pagina">Movimientos</h1>
        <a href="nuevomovimiento.html" class="boton-agregar">+</a>
    </div>

    <section class="resumen-movimientos">

        <article class="tarjeta-resumen ingresos">
            <p>Ingresos del mes</p>
            <h2>$ 850.000</h2>
        </article>

        <article class="tarjeta-resumen gastos">
            <p>Gastos del mes</p>
            <h2>$ 320.000</h2>
        </article>

    </section>


    <div class="pestanas-movimiento">
        <button class="pestana-movimiento activa" type="button" id="pestana-todos" onclick="cambiarTipo('todos')">
            Todos
        </button>
        <button class="pestana-movimiento" type="button" id="pestana-ingreso" onclick="cambiarTipo('ingreso')">
            Ingreso
        </button>
        <button class="pestana-movimiento" type="button" id="pestana-gasto" onclick="cambiarTipo('gasto')">
            Gasto
        </button>
        <button class="pestana-movimiento" type="button" id="pestana-transferencia" onclick="cambiarTipo('transferencia')">
            Transferencia
        </button>
    </div>


    <!-- BUSCADOR Y FILTRO -->
    <section class="busqueda-movimientos">

        <div class="contenedor-buscador">
            <span class="icono-busqueda">⌕</span>

            <input
                type="search"
                id="buscar-movimiento"
                placeholder="Buscar movimiento..."
            >
        </div>

        <button
            type="button"
            class="boton-filtro"
            title="Filtrar movimientos"
        >
            <span>☷</span>
        </button>

    </section>


    <!-- HISTORIAL DE MOVIMIENTOS -->
    <section class="historial-movimientos">
        <div id="historial"></div>
        <p id="mensaje-vacio" hidden>Todavía no registraste movimientos.</p>
    </section> 
    
</main>
<footer>
    <nav>
        <ul class="menu-footer">
            <li class="boton-footer">
                <a class="texto-footer" href="../index.html">
                    <img class="icono-footer" src="../img/iconoinicio.png" alt="Inicio">
                    <p>Inicio</p>
                </a>
            </li>
            <li class="boton-footer">
                <a class="texto-footer activo" href="movimientos.html">
                    <img class="icono-footer" src="../img/iconomovimientosactivo.png" alt="Movimientos">
                    <p>Movimientos</p>
                </a>
            </li>
            <li class="boton-nuevomovimiento-footer">
                <a href="nuevomovimiento.html">
                <img class="icono-nuevomovimiento-footer" src="../img/iconomas.png" alt="Nuevo movimiento">
                </a>
            </li>
            <li class="boton-footer">
                <a class="texto-footer" href="patrimonio.html">
                    <img class="icono-footer" src="../img/iconopatrimonio.png" alt="Patrimonio">
                    <p>Patrimonio</p>
                </a>
            </li>
            <li class="boton-footer">
                <a class="texto-footer" href="metas.html">
                    <img class="icono-footer" src="../img/iconometas.png" alt="Metas">
                    <p>Metas</p>
                </a>
            </li>
        </ul>
    </nav>
</footer>
<script src="../js/movimientos.js"></script>
</body>
</html>
