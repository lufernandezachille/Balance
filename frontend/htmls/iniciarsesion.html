<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logoapp.png" type="image/png">
</head>
<body>
<main>
    <h1 class="titulo-formulario">Iniciar Sesión</h1>
        <form class="formulario" action="#" method="POST">
        <div class="contenedor-campos">
        <div class="campo-formulario">
            <label class="titulo-campo" for="correo">Correo electrónico</label>
            <input class="input-formulario" type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
        </div>
        <div class="campo-formulario">
            <label class="titulo-campo" for="contrasena">Contraseña</label>
            <input class="input-formulario" type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required>
        </div>
        </div>
        <button class="boton-enviar" type="submit">Ingresar</button>
        <a class="texto-cuenta" href="../htmls/crearcuenta.html">¿No tienes cuenta? Crea una aquí</a>
        </form>
</main>
</body>
</html>
