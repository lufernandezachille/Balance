<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logoapp.png" type="image/png">
</head>
<body>
<main>
    <div class="contenedor-plan-premium">
        <img id="logo-plan-premium" src="../img/logo.png" alt="Logo Balance">
        <p class="titulo-plan">Pasate a Premium</p>
        <p class="subtitulo-plan">Más herramientas, menos límites.</p>
        <ul class="lista-beneficios">
            <li>Historial completo</li>
            <li>Metas de ahorro ilimitadas</li>
            <li>Movimientos recurrentes ilimitados</li>
        </ul>
        
        <button class="boton-plan" id="boton-mensual">
            1 Mes <span class="precio-plan" id="precio-mensual">Cargando...</span>
        </button>

        <button class="boton-plan" id="boton-anual">
            12 Meses <span class="precio-plan" id="precio-anual">Cargando...</span>
        </button>

        <button class="boton-plan-2" id="boton-guardar-plan" disabled> 
            Probá Balance Premium
        </button>
        <a href="#" class="cerrar-plan" onclick="history.back(); return false;">
            Ahora no, gracias.
        </a>
    </div>
</main>
<script src="../js/premium.js"></script>
</body>
</html>
