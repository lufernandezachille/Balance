<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logoapp.png" type="image/png">
</head>
<body>
    <header class="header">
        <div class="logo-header">
            <img src="../img/logoapp.png" alt="Logo de la aplicación" class="logo-app-header">
            <span class="logo-texto-header">Balance</span>
        </div>
        <a href="configuracion.html" class="micuenta-header" aria-label="Ir a Mi cuenta">
            <img src="../img/iconoperfil.png" alt="Foto de perfil" class="foto-perfil-header">
        </a>
    </header>
    <hr class="separador-header">

<main>
    <h1 class="titulo-pagina">Mi cuenta</h1>

    <!-- DATOS DEL USUARIO Y BADGE DE PLAN -->
    <section class="tarjeta-perfil">
        <div class="foto-perfil">
            <span>U</span>
        </div>
        <div class="informacion-perfil">
            <h2 id="nombre-perfil">Cargando...</h2>
            <p id="usuario-perfil">@usuario</p>
            <span id="badge-plan" class="badge-plan">Plan Gratuito</span>
        </div>
    </section>

    <!-- INFORMACIÓN PERSONAL (FORMULARIO GENERAL) -->
    <section class="seccion-cuenta">
        <div class="encabezado-seccion">
            <h2>Información personal</h2>
            <button type="button" class="boton-secundario" id="boton-activar-edicion">
                Editar información
            </button>
        </div>

        <!-- VISTA DE SOLO LECTURA (Visible por defecto) -->
        <div id="vista-informacion" class="datos-cuenta">
            <div class="campo-vista">
                <span class="etiqueta">Nombre completo</span>
                <p id="vista-nombre-completo">-</p>
            </div>
            <div class="campo-vista">
                <span class="etiqueta">Nombre de usuario</span>
                <p id="vista-usuario">-</p>
            </div>
            <div class="campo-vista">
                <span class="etiqueta">Correo electrónico</span>
                <p id="vista-correo">-</p>
            </div>
            <div class="campo-vista">
                <span class="etiqueta">Moneda predeterminada</span>
                <p id="vista-moneda">-</p>
            </div>
        </div>

        <!-- FORMULARIO DE EDICIÓN (Oculto por defecto) -->
        <form class="formulario-cuenta" id="formulario-cuenta" hidden>

            <div class="campo-cuenta">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="campo-cuenta">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>

            <div class="campo-cuenta">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" name="usuario" required>
            </div>

            <div class="campo-cuenta">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" name="correo" required>
            </div>

            <div class="campo-cuenta">
                <label for="moneda">Moneda predeterminada</label>
                <select id="moneda" name="moneda">
                    <option value="ARS">ARS - Peso argentino</option>
                    <option value="USD">USD - Dólar estadounidense</option>
                    <option value="EUR">EUR - Euro</option>
                    <option value="MXN">MXN - Peso mexicano</option>
                    <option value="CLP">CLP - Peso chileno</option>
                    <option value="COP">COP - Peso colombiano</option>
                </select>
            </div>

            <div class="botones-edicion">
                <button type="button" class="boton-cancelar" id="boton-cancelar-edicion">
                    Cancelar
                </button>
                <button type="submit" class="boton-guardar">
                    Guardar cambios
                </button>
            </div>

        </form>
    </section>

    <section class="seccion-cuenta">
        <h2>Suscripción y Plan</h2>
        <div class="detalle-plan">
            <p>Tu plan actual es: <strong id="texto-plan-actual">Gratuito</strong></p>

            <button type="button" id="boton-obtener-premium" class="boton-secundario">
                <a href="planpremium.html">Obtener Premium</a>
            </button>

            <button type="button" id="boton-cancelar-premium" class="boton-peligro" hidden>
                Cancelar suscripción
            </button>
        </div>
    </section>

    <!-- CERRAR SESIÓN -->
    <button type="button" class="boton-cerrar-sesion" id="boton-cerrar-sesion">
        Cerrar sesión
    </button>
</main>

<footer>
    <nav>
        <ul class="menu-footer">
            <li class="boton-footer">
                <a class="texto-footer" href="../index.html">
                    <img class="icono-footer" src="../img/iconoinicio.png" alt="Inicio">
                    <p>Inicio</p>
                </a>
            </li>
            <li class="boton-footer">
                <a class="texto-footer" href="movimientos.html">
                    <img class="icono-footer" src="../img/iconomovimientos.png" alt="Movimientos">
                    <p>Movimientos</p>
                </a>
            </li>
            <li class="boton-nuevomovimiento-footer">
                <a href="nuevomovimiento.html">
                    <img class="icono-nuevomovimiento-footer" src="../img/iconomas.png" alt="Nuevo movimiento">
                </a>
            </li>
            <li class="boton-footer">
                <a class="texto-footer" href="patrimonio.html">
                    <img class="icono-footer" src="../img/iconopatrimonio.png" alt="Patrimonio">
                    <p>Patrimonio</p>
                </a>
            </li>
            <li class="boton-footer">
                <a class="texto-footer" href="metas.html">
                    <img class="icono-footer" src="../img/iconometas.png" alt="Metas">
                    <p>Metas</p>
                </a>
            </li>
        </ul>
    </nav>
</footer>

<script src="../js/cuenta.js"></script>
</body>
</html>
