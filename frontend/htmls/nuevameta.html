<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Meta</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logoapp.png" type="image/png">
</head>
<body>
    <header class="header">
        <div class="logo-header">
            <img src="../img/logoapp.png" alt="Logo de la aplicación" class="logo-app-header">
            <span class="logo-texto-header">Balance</span>
        </div>
        <a href="configuracion.html" class="micuenta-header" aria-label="Ir a Mi cuenta">
            <img src="../img/iconoperfil.png" alt="Foto de perfil" class="foto-perfil-header">
        </a>
    </header>
    <hr class="separador-header">
<main>
    <h1 class="titulo-pagina">Nueva meta</h1>

    <form class="formulario" id="formulario-meta">

        <div class="contenedor-campos">

            <!-- Nombre -->
            <div class="campo-formulario">
                <label for="nombre" class="titulo-campo">Nombre de la meta</label>
                <input type="text" id="nombre" name="nombre" class="input-formulario input-texto" placeholder="Ej. Viaje a Europa" required>
            </div>

            <!-- Monto objetivo -->
            <div class="campo-formulario">
                <label for="monto" class="titulo-campo">
                    Monto objetivo
                </label>

                <div class="contenedor-monto">
                    <select
                        id="moneda"
                        name="moneda"
                        class="input-formulario"
                        required
                    >
                        <option value="ARS" selected>ARS</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="MXN">MXN</option>
                        <option value="CLP">CLP</option>
                        <option value="COP">COP</option>
                    </select>

                    <input
                        type="number"
                        id="monto"
                        name="monto"
                        class="input-formulario"
                        placeholder="0,00"
                        min="1"
                        step="0.01"
                        required
                    >
                </div>
            </div>

            <!-- Fecha objetivo -->
            <div class="campo-formulario">
                <label for="fecha-objetivo" class="titulo-campo">
                    Fecha objetivo
                </label>

                <input
                    type="date"
                    id="fecha-objetivo"
                    name="fecha_objetivo"
                    class="input-formulario input-fecha"
                >
            </div>

        </div>

        <button type="submit" class="boton-enviar" id="boton-meta">
            Crear meta
        </button>

    </form>

</main>
<footer>
    <nav>
        <ul class="menu-footer">
            <li class="boton-footer">
                <a class="texto-footer" href="../index.html">
                    <img class="icono-footer" src="../img/iconoinicio.png" alt="Inicio">
                    <p>Inicio</p>
                </a>
            </li>
            <li class="boton-footer">
                <a class="texto-footer" href="movimientos.html">
                    <img class="icono-footer" src="../img/iconomovimientos.png" alt="Movimientos">
                    <p>Movimientos</p>
                </a>
            </li>
            <li class="boton-nuevomovimiento-footer">
                <a href="nuevomovimiento.html">
                <img class="icono-nuevomovimiento-footer" src="../img/iconomas.png" alt="Nuevo movimiento">
                </a>
            </li>
            <li class="boton-footer">
                <a class="texto-footer" href="patrimonio.html">
                    <img class="icono-footer" src="../img/iconopatrimonio.png" alt="Patrimonio">
                    <p>Patrimonio</p>
                </a>
            </li>
            <li class="boton-footer">
                <a class="texto-footer activo" href="metas.html">
                    <img class="icono-footer" src="../img/iconometasactivo.png" alt="Metas">
                    <p>Metas</p>
                </a>
            </li>
        </ul>
    </nav>
</footer>
<script src="../js/metas.js"></script>
</body>
</html>
