<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrimonio</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="icon" href="../img/logoapp.png" type="image/png">
</head>
<body>
    <header class="header">
        <div class="logo-header">
            <img src="../img/logoapp.png" alt="Logo de la aplicación" class="logo-app-header">
            <span class="logo-texto-header">Balance</span>
        </div>
        <a href="configuracion.html" class="micuenta-header" aria-label="Ir a Mi cuenta">
            <img src="../img/iconoperfil.png" alt="Foto de perfil" class="foto-perfil-header">
        </a>
    </header>
    <hr class="separador-header">

    <main>
        <h1 class="titulo-pagina">Patrimonio</h1>

        <!-- PESTAÑAS PRINCIPALES -->
        <div class="pestanas-movimiento">
            <button class="pestana-movimiento activa" type="button" id="tab-resumen" onclick="cambiarPestanaPatrimonio('resumen')">
                Resumen
            </button>
            <button class="pestana-movimiento" type="button" id="tab-cuentas" onclick="cambiarPestanaPatrimonio('cuentas')">
                Cuentas
            </button>
            <button class="pestana-movimiento" type="button" id="tab-fondos" onclick="cambiarPestanaPatrimonio('fondos')">
                Fondos
            </button>
        </div>

        <!-- ==================== VISTA 1: RESUMEN Y GRÁFICOS ==================== -->
        <div id="vista-resumen">
            <section class="tarjeta-patrimonio-total">
                <p class="etiqueta-patrimonio">Patrimonio total</p>
                <h2 id="patrimonio-total-monto">$ 0,00</h2>
                <p class="equivalente-patrimonio" id="patrimonio-moneda-base">
                    Equivalente en ARS
                </p>
            </section>

            <div class="actualizacion-cotizaciones">
                <span>◷</span>
                <p id="texto-cotizaciones">Cargando cotizaciones...</p>
            </div>

            <!-- DISTRIBUCIÓN POR MONEDA -->
            <section class="tarjeta-distribucion">
                <h2 class="titulo-seccion-patrimonio">
                    Distribución por moneda
                </h2>

                <div class="barra-distribucion" id="barra-distribucion"></div>

                <div class="lista-monedas" id="lista-monedas"></div>
            </section>

            <!-- EVOLUCIÓN DEL PATRIMONIO -->
            <section class="tarjeta-evolucion">
                <div class="encabezado-evolucion">
                    <h2 class="titulo-seccion-patrimonio" id="titulo-evolucion">
                        Evolución (1A)
                    </h2>

                    <div class="periodos-evolucion">
                        <button type="button" class="periodo-evolucion" data-periodo="1M" onclick="cambiarPeriodoEvolucion('1M')">
                            1M
                        </button>
                        <button type="button" class="periodo-evolucion" data-periodo="6M" onclick="cambiarPeriodoEvolucion('6M')">
                            6M
                        </button>
                        <button type="button" class="periodo-evolucion activo" data-periodo="1A" onclick="cambiarPeriodoEvolucion('1A')">
                            1A
                        </button>
                    </div>
                </div>

                <div class="grafico-patrimonio">
                    <svg id="svg-evolucion" viewBox="0 0 320 130" preserveAspectRatio="none">
                        <line x1="0" y1="20" x2="320" y2="20" class="linea-referencia"/>
                        <line x1="0" y1="65" x2="320" y2="65" class="linea-referencia"/>
                        <line x1="0" y1="110" x2="320" y2="110" class="linea-referencia"/>

                        <polygon id="area-evolucion" points="" class="area-grafico"/>
                        <polyline id="linea-evolucion" points="" class="linea-grafico"/>
                        <g id="puntos-evolucion"></g>
                    </svg>
                </div>
            </section>
        </div>

        <!-- ==================== VISTA 2: MIS CUENTAS ==================== -->
        <div id="vista-cuentas" hidden>
            <div class="encabezado-agregar" style="margin-top: 12px;">
                <h2 class="titulo-seccion-patrimonio">Mis cuentas</h2>
                <button type="button" class="boton-agregar" id="btn-mostrar-form-cuenta">+</button>
            </div>

            <!-- FORMULARIO CREAR / EDITAR CUENTA -->
            <form class="formulario" id="form-cuenta" hidden style="margin-bottom: 18px;">
                <input type="hidden" id="cuenta-id">

                <div class="contenedor-campos">
                    <div class="campo-formulario">
                        <label class="titulo-campo" for="cuenta-nombre">Nombre de la cuenta</label>
                        <input class="input-formulario" type="text" id="cuenta-nombre" placeholder="Ej. Mercado Pago, Banco Galicia, Efectivo" required>
                    </div>

                    <div class="campo-formulario">
                        <label class="titulo-campo" for="cuenta-tipo">Tipo de cuenta</label>
                        <select class="input-formulario" id="cuenta-tipo" required>
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="BANCO">Banco</option>
                            <option value="BILLETERA_VIRTUAL">Billetera virtual</option>
                            <option value="TARJETA_CREDITO">Tarjeta de crédito</option>
                            <option value="INVERSIONES">Inversiones</option>
                        </select>
                    </div>

                    <div class="campo-formulario">
                        <label class="titulo-campo" for="cuenta-moneda">Moneda</label>
                        <select class="input-formulario" id="cuenta-moneda" required>
                            <option value="" disabled selected>Selecciona una moneda</option>
                        </select>
                    </div>

                    <div class="campo-formulario" id="campo-cuenta-saldo">
                        <label class="titulo-campo" for="cuenta-saldo">Saldo inicial</label>
                        <input class="input-formulario" type="number" id="cuenta-saldo" step="0.01" value="0" required>
                    </div>

                    <div class="campo-formulario">
                        <label class="titulo-campo">
                            <input type="checkbox" id="cuenta-incluir" checked>
                            Incluir en el cálculo de patrimonio total
                        </label>
                    </div>
                </div>

                <div class="botones-edicion">
                    <button type="button" class="boton-cancelar" id="btn-cancelar-cuenta">Cancelar</button>
                    <button type="submit" class="boton-guardar" id="btn-guardar-cuenta">Guardar cuenta</button>
                </div>
            </form>

            <div class="lista-fondos" id="lista-cuentas-patrimonio"></div>
            <p id="mensaje-cuentas-vacio" hidden>Todavía no creaste ninguna cuenta.</p>
        </div>

        <!-- ==================== VISTA 3: MIS FONDOS ==================== -->
        <div id="vista-fondos" hidden>
            <div class="encabezado-agregar" style="margin-top: 12px;">
                <h2 class="titulo-seccion-patrimonio">Mis fondos</h2>
                <button type="button" class="boton-agregar" id="btn-mostrar-form-fondo">+</button>
            </div>

            <!-- FORMULARIO CREAR / EDITAR FONDO -->
            <form class="formulario" id="form-fondo" hidden style="margin-bottom: 18px;">
                <input type="hidden" id="fondo-id">

                <div class="contenedor-campos">
                    <div class="campo-formulario">
                        <label class="titulo-campo" for="fondo-nombre">Nombre del fondo</label>
                        <input class="input-formulario" type="text" id="fondo-nombre" placeholder="Ej. Fondo de emergencia, Impuestos" required>
                    </div>
                </div>

                <div class="botones-edicion">
                    <button type="button" class="boton-cancelar" id="btn-cancelar-fondo">Cancelar</button>
                    <button type="submit" class="boton-guardar" id="btn-guardar-fondo">Guardar fondo</button>
                </div>
            </form>

            <div class="lista-fondos" id="lista-fondos-patrimonio"></div>
        </div>
    </main>

    <footer>
        <nav>
            <ul class="menu-footer">
                <li class="boton-footer">
                    <a class="texto-footer" href="../index.html">
                        <img class="icono-footer" src="../img/iconoinicio.png" alt="Inicio">
                        <p>Inicio</p>
                    </a>
                </li>
                <li class="boton-footer">
                    <a class="texto-footer" href="movimientos.html">
                        <img class="icono-footer" src="../img/iconomovimientos.png" alt="Movimientos">
                        <p>Movimientos</p>
                    </a>
                </li>
                <li class="boton-nuevomovimiento-footer">
                    <a href="nuevomovimiento.html">
                        <img class="icono-nuevomovimiento-footer" src="../img/iconomas.png" alt="Nuevo movimiento">
                    </a>
                </li>
                <li class="boton-footer">
                    <a class="texto-footer activo" href="patrimonio.html">
                        <img class="icono-footer" src="../img/iconopatrimonioactivo.png" alt="Patrimonio">
                        <p>Patrimonio</p>
                    </a>
                </li>
                <li class="boton-footer">
                    <a class="texto-footer" href="metas.html">
                        <img class="icono-footer" src="../img/iconometas.png" alt="Metas">
                        <p>Metas</p>
                    </a>
                </li>
            </ul>
        </nav>
    </footer>

    <script src="../js/patrimonio.js"></script>
</body>
</html>
