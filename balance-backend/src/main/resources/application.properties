spring.application.name=balance-backend

spring.datasource.url=jdbc:mysql://localhost:3306/balance_db?serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
jwt.expiracion=86400000

spring.jpa.hibernate.ddl-auto=update

spring.jackson.time-zone=America/Argentina/Buenos_Aires
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

server.error.include-message=always